[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "court-assignment-audit"
version = "0.1.0"
description = "A reproducible, entirely synthetic demonstration of assignment anomaly analysis."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "streamlit>=1.65,<2",
  "altair>=5.5,<6",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
court-assignment-demo = "court_assignment_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
